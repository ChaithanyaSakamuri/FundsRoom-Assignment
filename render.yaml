services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js API)
  # ---------------------------------------------------------------------------
  - type: web
    name: nexora-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npx prisma db seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: nexora-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://nexora-backend-zzs8.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
