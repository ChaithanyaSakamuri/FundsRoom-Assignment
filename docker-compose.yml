version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nexora_db
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora_db
    ports:
      - "5432:5432"
    volumes:
      - nexora_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora_backend
    environment:
      DATABASE_URL: "postgresql://nexora:nexora@db:5432/nexora_db"
      JWT_SECRET: "${JWT_SECRET:-nexora-jwt-secret-change-in-production}"
      JWT_EXPIRES_IN: "24h"
      NODE_ENV: "production"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nexora_db_data:
